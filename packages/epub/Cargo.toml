[package]
name = "book_epub"
version = "0.1.0"
edition = "2021"
description = "Inspeção, validação e empacotamento de EPUB 3 para o Editor de Livros EPUB."
license = "UNLICENSED"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
roxmltree = "0.20"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
